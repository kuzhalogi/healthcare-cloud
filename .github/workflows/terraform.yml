name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'

# OIDC needs this. Without id-token: write, the AWS auth step gets no token
# to present and the job fails before it reaches Terraform.
permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.8
  WORKING_DIR: terraform

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Fails if any file is unformatted. Cheap, and it keeps diffs clean.
      - name: Check formatting
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform fmt -check -recursive

      # No backend, so this runs without touching AWS. Catches syntax errors
      # and bad references before we spend a round trip on credentials.
      - name: Init without backend
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -backend=false

      - name: Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      # No stored secrets. GitHub presents a signed OIDC token, AWS checks it
      # names this repository, and hands back credentials that expire in an hour.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init

      - name: Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan -no-color -input=false \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            > plan.txt 2>&1
        continue-on-error: true

      # Post the plan to the PR so a reviewer sees what would change without
      # having to open the Actions log.
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan.txt', 'utf8');

            // PR comments cap out around 65k characters.
            const LIMIT = 60000;
            if (plan.length > LIMIT) {
              plan = plan.slice(0, LIMIT) + '\n\n... truncated. See the full log in Actions.';
            }

            const body = [
              '#### Terraform Plan `${{ steps.plan.outcome }}`',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>'
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      # continue-on-error above lets the comment post even on a failed plan.
      # This step makes the job actually fail so the PR check goes red.
      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

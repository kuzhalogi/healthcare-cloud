<svg viewBox="0 0 860 520" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="860" height="520" fill="#0f1720"/>
  <text x="430" y="38" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">MedShare · AWS Architecture</text>
  <text x="430" y="60" fill="#8b9aa8" font-size="13" text-anchor="middle">Serverless hospital data sharing platform</text>

  <!-- User -->
  <rect x="40" y="110" width="130" height="60" rx="10" fill="#17222e" stroke="#24333f"/>
  <text x="105" y="138" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Doctor / Patient</text>
  <text x="105" y="156" fill="#8b9aa8" font-size="11" text-anchor="middle">browser</text>

  <!-- CloudFront + S3 -->
  <rect x="230" y="90" width="150" height="50" rx="10" fill="#17222e" stroke="#24333f"/>
  <text x="305" y="112" fill="#2dd4a7" font-size="12" font-weight="600" text-anchor="middle">CloudFront</text>
  <text x="305" y="128" fill="#8b9aa8" font-size="10" text-anchor="middle">CDN + React app on S3</text>

  <!-- Cognito -->
  <rect x="230" y="160" width="150" height="50" rx="10" fill="#17222e" stroke="#24333f"/>
  <text x="305" y="182" fill="#2dd4a7" font-size="12" font-weight="600" text-anchor="middle">Cognito</text>
  <text x="305" y="198" fill="#8b9aa8" font-size="10" text-anchor="middle">auth · doctors / patients</text>

  <!-- API Gateway -->
  <rect x="440" y="125" width="140" height="60" rx="10" fill="#17222e" stroke="#24333f"/>
  <text x="510" y="150" fill="#2dd4a7" font-size="12" font-weight="600" text-anchor="middle">API Gateway</text>
  <text x="510" y="167" fill="#8b9aa8" font-size="10" text-anchor="middle">HTTP API · JWT auth</text>

  <!-- Lambdas -->
  <rect x="440" y="230" width="140" height="40" rx="8" fill="#17222e" stroke="#24333f"/>
  <text x="510" y="255" fill="#e6edf3" font-size="11" text-anchor="middle">Lambda · Patients</text>
  <rect x="440" y="280" width="140" height="40" rx="8" fill="#17222e" stroke="#24333f"/>
  <text x="510" y="305" fill="#e6edf3" font-size="11" text-anchor="middle">Lambda · Appointments</text>
  <rect x="440" y="330" width="140" height="40" rx="8" fill="#17222e" stroke="#24333f"/>
  <text x="510" y="355" fill="#e6edf3" font-size="11" text-anchor="middle">Lambda · Records</text>

  <!-- Data stores -->
  <rect x="650" y="230" width="160" height="90" rx="10" fill="#17222e" stroke="#24333f"/>
  <text x="730" y="255" fill="#2dd4a7" font-size="12" font-weight="600" text-anchor="middle">DynamoDB</text>
  <text x="730" y="273" fill="#8b9aa8" font-size="10" text-anchor="middle">patients</text>
  <text x="730" y="289" fill="#8b9aa8" font-size="10" text-anchor="middle">appointments</text>
  <text x="730" y="305" fill="#8b9aa8" font-size="10" text-anchor="middle">records</text>

  <rect x="650" y="330" width="160" height="45" rx="10" fill="#17222e" stroke="#24333f"/>
  <text x="730" y="352" fill="#2dd4a7" font-size="12" font-weight="600" text-anchor="middle">S3</text>
  <text x="730" y="368" fill="#8b9aa8" font-size="10" text-anchor="middle">encrypted documents</text>

  <!-- KMS + CloudWatch -->
  <rect x="440" y="410" width="140" height="45" rx="10" fill="#17222e" stroke="#24333f"/>
  <text x="510" y="432" fill="#f0b849" font-size="12" font-weight="600" text-anchor="middle">KMS</text>
  <text x="510" y="448" fill="#8b9aa8" font-size="10" text-anchor="middle">encryption at rest</text>

  <rect x="650" y="410" width="160" height="45" rx="10" fill="#17222e" stroke="#24333f"/>
  <text x="730" y="432" fill="#f0b849" font-size="12" font-weight="600" text-anchor="middle">CloudWatch</text>
  <text x="730" y="448" fill="#8b9aa8" font-size="10" text-anchor="middle">logs + dashboard</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a5c6a"/>
    </marker>
  </defs>
  <line x1="170" y1="130" x2="228" y2="115" stroke="#4a5c6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="150" x2="228" y2="182" stroke="#4a5c6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="150" x2="438" y2="150" stroke="#4a5c6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="185" x2="510" y2="228" stroke="#4a5c6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="255" x2="648" y2="262" stroke="#4a5c6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="350" x2="648" y2="350" stroke="#4a5c6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="430" y="495" fill="#8b9aa8" font-size="11" text-anchor="middle">Every request is authenticated by Cognito, encrypted at rest with KMS, and logged to CloudWatch.</text>
</svg>
